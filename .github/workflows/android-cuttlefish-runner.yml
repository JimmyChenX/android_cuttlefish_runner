name: android cuttlefish runner

on:
  workflow_dispatch:
    inputs:
      ubuntu:
        description: 'ubuntu version'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
        - ubuntu-latest
        - ubuntu-26.04
        - ubuntu-26.04-arm
        - ubuntu-24.04
        - ubuntu-24.04-arm
      branch:
        description: 'aosp branch'
        required: true
        default: 'aosp-android-latest-release'
        type: string
      device:
        description: 'aosp device'
        required: true
        default: 'aosp_cf_x86_64_only_phone'
        type: string
      timeout:
        description: 'time out'
        required: true
        default: '10m'
        type: string
      debug:
        description: 'start file server'
        default: false
        required: true
        type: boolean

jobs:
  run:
    name: runner
    runs-on: ${{ inputs.ubuntu }}
    env:
      CF_HOME: /home/runner/aosp_cf

    steps:
      - name: Check out 
        uses: actions/checkout@v7

      - name: Set env
        run: |
          sudo curl -fsSL https://us-apt.pkg.dev/doc/repo-signing-key.gpg -o /etc/apt/trusted.gpg.d/artifact-registry.asc
          sudo chmod a+r /etc/apt/trusted.gpg.d/artifact-registry.asc
          echo "deb https://us-apt.pkg.dev/projects/android-cuttlefish-artifacts android-cuttlefish main" | sudo tee -a /etc/apt/sources.list.d/artifact-registry.list
          sudo apt update
          sudo sysctl -w "net.ipv4.ping_group_range=0 2000000"

      - name: Setup cloudflared
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
        run: |
          ARCH=$(uname -m) && \
          case $ARCH in \
            x86_64) ARCH_NAME="amd64" ;; \
            aarch64|arm64) ARCH_NAME="arm64" ;; \
            armv7l|armhf) ARCH_NAME="armhf" ;; \
            i386|i686) ARCH_NAME="386" ;; \
            *) echo "unsupported arch: $ARCH" && exit 1 ;; \
          esac && \
          curl -L -o cloudflared.deb "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-${ARCH_NAME}.deb"
          sudo dpkg -i cloudflared.deb
          #sudo cloudflared service install $CF_TOKEN

      - name: Start File Server
        if: ${{ inputs.debug == true }}
        run: |
          cd /home/runner
          python -m http.server 8000 &
          sudo cloudflared tunnel --url http://localhost:8000 &

      - name: Init env
        run: |
          bash -x tools/init.sh

      - name: Download cf images
        run: |
          bash -x tools/download.sh
        env:
          BRANCH: ${{ inputs.branch }}
          DEVICE: ${{ inputs.device }}

      - name: Run cf
        run: |
          sudo su $USER -c "nohup bash -x tools/run.sh '$CF_HOME' > run.log 2>&1 &"

      - name: Start CVD Server
        run: |
          # 1. 启动 Python 代理
          python3 tools/proxy.py &
          
          # 2. 启动 Cloudflare 隧道，并将日志保存到文件
          # 使用 nohup 确保它在后台持续运行
          nohup sudo cloudflared tunnel --url http://localhost:8080 > cf.log 2>&1 &
          
          # 3. 等待隧道建立并抓取 URL
          echo "Waiting for Cloudflare URL..."
          MAX_RETRIES=10
          COUNT=0
          while [ $COUNT -lt $MAX_RETRIES ]; do
            CF_URL=$(grep -o 'https://[-a-z0-9.]*\.trycloudflare.com' cf.log | head -n 1)
            if [ ! -z "$CF_URL" ]; then
              echo "==============================================="
              echo "Cuttlefish Web UI: $CF_URL"
              echo "==============================================="
              break
            fi
            sleep 3
            COUNT=$((COUNT+1))
          done

      - name: Start Ngrok TCP Tunnel
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          # 安装 ngrok
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok
          
          # 配置 token
          ngrok config add-authtoken $NGROK_AUTH_TOKEN
          
          # 启动 TCP 转发到 6520 端口 (Cuttlefish ADB)
          # 注意：使用 --log=stdout 方便我们在控制台看到输出
          nohup ngrok tcp 6520 --log=stdout > ngrok.log 2>&1 &
          
          # 等待几秒，确保隧道建立
          sleep 5
          
          # 从本地 API 获取 ngrok 分配的公网地址
          echo "==============================================="
          echo "ADB Remote Address:"
          curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url'
          echo "==============================================="

      - name: Print Logs
        run: |
          until find $CF_HOME/cuttlefish/instances -type f -path "*/cvd-*/logs/*.log" 2>/dev/null | grep -q .; do
              timeout 10s tail -f *.log || true
          done
          timeout $TIMEOUT tail -F $CF_HOME/cuttlefish/instances/cvd-?/logs/* || true
        env:
          TIMEOUT: ${{ inputs.timeout }}

      - name: Test adb
        run: |
          HOME=$CF_HOME $CF_HOME/bin/adb_connector || $CF_HOME/bin/adb connect 127.0.0.1:6520
          $CF_HOME/bin/adb devices

